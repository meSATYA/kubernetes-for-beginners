# Same Pod name ("web"), two namespaces: no conflict.
apiVersion: v1
kind: Pod
metadata:
  name: web
  namespace: dev
spec:
  containers:
    - name: nginx
      image: nginx:1.27
---
apiVersion: v1
kind: Pod
metadata:
  name: web
  namespace: staging
spec:
  containers:
    - name: nginx
      image: nginx:1.27
