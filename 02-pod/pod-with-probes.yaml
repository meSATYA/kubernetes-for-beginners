apiVersion: v1
kind: Pod
metadata:
  name: probe-demo
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
      resources:
        requests:               # "I need at least this much"
          cpu: 100m
          memory: 64Mi
        limits:                 # "never let me use more than this"
          cpu: 250m
          memory: 128Mi
      readinessProbe:           # Is the app ready to receive traffic?
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 3
        periodSeconds: 5
      livenessProbe:            # Is the app still alive? If not, restart it.
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 10
        periodSeconds: 10
