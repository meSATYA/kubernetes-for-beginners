apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deploy
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1         # at most 1 Pod may be down during the update
      maxSurge: 1               # at most 1 extra Pod may be created during the update
  selector:
    matchLabels:
      app: web-deploy
  template:
    metadata:
      labels:
        app: web-deploy
    spec:
      containers:
        - name: nginx
          image: nginx:1.26     # change this tag and re-apply to trigger an update
          ports:
            - containerPort: 80
