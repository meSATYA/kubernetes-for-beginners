apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: hello
          image: nginxdemos/hello    # shows the serving Pod's name on the page
          ports:
            - containerPort: 80
