apiVersion: batch/v1
kind: CronJob
metadata:
  name: date-printer
spec:
  schedule: "*/1 * * * *"            # every minute
  concurrencyPolicy: Forbid          # skip a run if the last one is still running
  successfulJobsHistoryLimit: 3      # keep the last 3 successful Jobs
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: printer
              image: busybox:1.36
              command: ["sh", "-c", "echo \"Hello from CronJob at $(date)\""]
