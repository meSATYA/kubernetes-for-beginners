apiVersion: v1
kind: LimitRange
metadata:
  name: team-a-limits
  namespace: team-a
spec:
  limits:
    - type: Container
      default:                   # applied when a container sets no limit
        cpu: 250m
        memory: 256Mi
      defaultRequest:            # applied when a container sets no request
        cpu: 100m
        memory: 128Mi
      max:                       # no single container may exceed this
        cpu: 500m
        memory: 512Mi
