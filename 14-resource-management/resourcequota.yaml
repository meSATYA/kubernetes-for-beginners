apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-a-quota
  namespace: team-a
spec:
  hard:
    pods: "5"                    # at most 5 Pods in this namespace
    requests.cpu: "1"            # all Pods together may REQUEST 1 CPU
    requests.memory: 1Gi
    limits.cpu: "2"              # ...and may be LIMITED to 2 CPUs total
    limits.memory: 2Gi
