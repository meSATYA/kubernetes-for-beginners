apiVersion: batch/v1
kind: Job
metadata:
  name: parallel-job
spec:
  completions: 6                     # total successful Pods needed
  parallelism: 2                     # how many run at the same time
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "echo worker $HOSTNAME started; sleep 10; echo finished"]
