apiVersion: v1
kind: Pod
metadata:
  name: configmap-volume-demo
spec:
  containers:
    - name: demo
      image: busybox:1.36
      command: ["sh", "-c", "while true; do echo '--- app.properties ---'; cat /etc/config/app.properties; sleep 30; done"]
      volumeMounts:
        - name: config-vol
          mountPath: /etc/config      # each key becomes a file here
  volumes:
    - name: config-vol
      configMap:
        name: app-config
